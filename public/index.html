<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FocusTrack</title>
<link rel="stylesheet" href="/style.css">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FocusTrack">
<link rel="icon" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
(function () {
  var reserved = { master: 1, api: 1, admin: 1, health: 1 };
  var seg = location.pathname.split('/').filter(Boolean)[0] || '';
  var slug = (/^[a-z0-9][a-z0-9-]{1,31}$/.test(seg) && !reserved[seg]) ? seg : '';
  var l = document.createElement('link');
  l.rel = 'manifest';
  l.href = slug ? '/' + slug + '/manifest.webmanifest' : '/manifest.webmanifest';
  document.head.appendChild(l);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
})();
</script>
<style>
  body{display:flex;flex-direction:column;align-items:center;padding:38px 16px 60px}
  .wrap{width:100%;max-width:440px}
  .hero{text-align:center;margin-bottom:26px}
  .hero h1{font-size:29px;letter-spacing:-1px;margin:16px 0 8px}
  .hero p{color:var(--dim);font-size:15px;line-height:1.5;margin:0}

  /* --- focus mark: a target that breathes, an arc that sweeps --- */
  .mark{display:block;margin:0 auto}
  .mark .sweep{
    transform-origin:60px 60px;
    animation:sweep 4s cubic-bezier(.45,0,.25,1) infinite;
  }
  .mark .dashring{
    transform-origin:60px 60px;
    animation:spin 22s linear infinite;
  }
  .mark .pulse{
    transform-origin:60px 60px;
    animation:pulse 4s ease-in-out infinite;
  }
  .mark .core{
    transform-origin:60px 60px;
    animation:core 4s ease-in-out infinite;
  }
  @keyframes sweep{
    0%   {stroke-dashoffset:295; transform:rotate(-90deg)}
    70%  {stroke-dashoffset:0;   transform:rotate(-90deg)}
    100% {stroke-dashoffset:0;   transform:rotate(270deg)}
  }
  @keyframes spin{ to{transform:rotate(360deg)} }
  @keyframes pulse{
    0%,100%{transform:scale(1);   opacity:.30}
    50%    {transform:scale(1.14);opacity:.06}
  }
  @keyframes core{
    0%,100%{transform:scale(1)}
    50%    {transform:scale(.78)}
  }
  @media (prefers-reduced-motion: reduce){
    .mark .sweep,.mark .dashring,.mark .pulse,.mark .core{animation:none}
  }

  .slugline{display:flex;align-items:center}
  .slugline .pre{
    background:#0f1218;border:1px solid var(--line);border-right:none;color:var(--dim);
    padding:13px 0 13px 13px;border-radius:12px 0 0 12px;font-size:14px;white-space:nowrap
  }
  .slugline input{border-radius:0 12px 12px 0;border-left:none;padding-left:2px}
  .hint{font-size:12px;margin-top:7px;min-height:16px}
  .done{text-align:center}
  .done .big{font-size:46px;margin-bottom:8px}
  .urlbox{
    background:#0f1218;border:1px solid var(--line);border-radius:12px;padding:14px;
    margin:12px 0;word-break:break-all;font-size:14px
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <svg class="mark" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="pulse" cx="60" cy="60" r="52" fill="none" stroke="#4f9cf9" stroke-width="1.5"/>
      <circle class="dashring" cx="60" cy="60" r="52" fill="none" stroke="#2f3a4d"
              stroke-width="1.5" stroke-dasharray="2 9" stroke-linecap="round"/>
      <circle cx="60" cy="60" r="47" fill="none" stroke="#262a34" stroke-width="6"/>
      <circle class="sweep" cx="60" cy="60" r="47" fill="none" stroke="#4f9cf9" stroke-width="6"
              stroke-linecap="round" stroke-dasharray="295"/>
      <circle class="core" cx="60" cy="60" r="9" fill="#4f9cf9"/>
    </svg>

    <h1>FocusTrack</h1>
    <p>See where your team's hours actually go.</p>
  </div>

  <!-- SIGNUP -->
  <div class="card" id="signupCard">
    <h2>CREATE YOUR WORKSPACE</h2>

    <label>Invite code</label>
    <input id="code" placeholder="XXXX-XXXX" autocapitalize="characters" autocomplete="off">
    <div class="gap"></div>

    <label>Business name</label>
    <input id="bizName" placeholder="e.g. U2ber Club Studio">
    <div class="gap"></div>

    <label>Your team link</label>
    <div class="slugline">
      <span class="pre" id="origin">/</span>
      <input id="slug" placeholder="u2berclub" autocapitalize="none" autocomplete="off">
    </div>
    <div class="hint muted" id="slugHint">Your team members will open this link every day.</div>
    <div class="gap"></div>

    <label>Your name (you'll be the admin)</label>
    <input id="ownerName" placeholder="e.g. Atul">
    <div class="gap"></div>

    <label>Choose your PIN</label>
    <input id="pin" type="password" inputmode="numeric" placeholder="4+ digits">
    <div class="gap"></div>

    <label>Email</label>
    <input id="email" type="email" placeholder="you@company.com">

    <button class="btn" id="go">Create workspace</button>
    <div class="err" id="err"></div>
  </div>

  <!-- SUCCESS -->
  <div class="card hidden done" id="doneCard">
    <div class="big">🎉</div>
    <h1 id="doneTitle">You're all set</h1>
    <p class="sub" id="doneMsg" style="margin:8px 0 0"></p>
    <div id="urls">
      <div style="text-align:left;margin-top:18px">
        <label>Send this to your team</label>
        <div class="urlbox" id="staffUrl"></div>
        <label>Your admin dashboard</label>
        <div class="urlbox" id="adminUrl"></div>
      </div>
      <button class="btn" id="openAdmin">Open my dashboard</button>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const api = async (p, o = {}) => {
  const r = await fetch(p, { headers: { 'Content-Type': 'application/json' }, ...o });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong');
  return d;
};

$('#origin').textContent = location.origin.replace(/^https?:\/\//, '') + '/';

const slugify = (s) => String(s).toLowerCase().trim()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32);

// Suggest a link from the business name, until the user edits it themselves.
let slugTouched = false;
$('#slug').addEventListener('input', () => { slugTouched = true; checkSlug(); });
$('#bizName').addEventListener('input', () => {
  if (slugTouched) return;
  $('#slug').value = slugify($('#bizName').value);
  checkSlug();
});
$('#code').addEventListener('input', (e) => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
});

let checkTimer;
function checkSlug() {
  clearTimeout(checkTimer);
  const v = slugify($('#slug').value);
  if (!v) { setHint('Your team members will open this link every day.', 'muted'); return; }
  checkTimer = setTimeout(async () => {
    try {
      const d = await api('/api/slug-available/' + encodeURIComponent(v));
      setHint(d.available ? `${v} is available` : d.reason, d.available ? 'ok' : 'bad');
    } catch { /* ignore */ }
  }, 300);
}
function setHint(text, kind) {
  const el = $('#slugHint');
  el.textContent = text;
  el.style.color = kind === 'ok' ? 'var(--good)' : kind === 'bad' ? 'var(--bad)' : 'var(--dim)';
}

$('#go').onclick = async () => {
  $('#err').textContent = '';
  $('#go').disabled = true;
  try {
    const d = await api('/api/signup', {
      method: 'POST',
      body: JSON.stringify({
        code: $('#code').value,
        business_name: $('#bizName').value,
        slug: slugify($('#slug').value),
        owner_name: $('#ownerName').value,
        owner_pin: $('#pin').value,
        contact_email: $('#email').value,
      }),
    });
    $('#signupCard').classList.add('hidden');
    $('#doneCard').classList.remove('hidden');
    $('#doneMsg').textContent = d.message;
    if (d.status === 'active') {
      $('#staffUrl').textContent = location.origin + d.loginUrl;
      $('#adminUrl').textContent = location.origin + d.adminUrl;
      $('#openAdmin').onclick = () => { location.href = d.adminUrl; };
    } else {
      $('#doneTitle').textContent = 'Request received';
      $('#urls').classList.add('hidden');
    }
    window.scrollTo(0, 0);
  } catch (e) {
    $('#err').textContent = e.message;
  } finally {
    $('#go').disabled = false;
  }
};

$('#pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#go').click(); });
</script>
</body>
</html>
