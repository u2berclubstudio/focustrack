<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusTrack · Dashboard</title>
<link rel="stylesheet" href="/style.css">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="icon" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
(function () {
  var reserved = { master: 1, api: 1, admin: 1, health: 1 };
  var seg = location.pathname.split('/').filter(Boolean)[0] || '';
  var slug = (/^[a-z0-9][a-z0-9-]{1,31}$/.test(seg) && !reserved[seg]) ? seg : '';
  var l = document.createElement('link');
  l.rel = 'manifest';
  l.href = slug ? '/' + slug + '/manifest.webmanifest' : '/manifest.webmanifest';
  document.head.appendChild(l);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
})();
</script>
<style>
  body{padding:24px 18px 60px}
  .wrap{max-width:1120px;margin:0 auto}
  .top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .controls select,.controls input{width:auto;padding:9px 11px;font-size:14px}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .tab{background:transparent;border:1px solid var(--line);color:var(--dim);
       border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#04101f}

  /* --- headline --- */
  .headline{font-size:19px;line-height:1.55;margin:0}
  .headline b{color:var(--txt);font-weight:600}
  .headline .hl{color:var(--accent)}

  /* --- person cards --- */
  .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .person{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .person .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
  .person .nm{font-size:17px;font-weight:600}
  .person .dept{font-size:12px;color:var(--dim);margin-top:2px}
  .verdict{font-size:13px;font-weight:600;border-radius:8px;padding:5px 11px;white-space:nowrap}
  .meter{height:8px;border-radius:5px;background:#0f1218;overflow:hidden;margin-bottom:16px}
  .meter i{display:block;height:100%;border-radius:5px}
  .facts{font-size:14px;line-height:1.75}
  .facts div{display:flex;gap:9px;align-items:flex-start}
  .facts .ic{width:17px;flex:none;text-align:center;color:var(--dim);font-size:13px;line-height:1.75}
  .facts b{font-weight:600}
  .nodata{color:var(--dim);font-size:14px}

  /* --- details tab --- */
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .kpi b{display:block;font-size:30px;letter-spacing:-1px;line-height:1.15}
  .kpi span{font-size:12px;color:var(--dim)}
  .bar{height:9px;border-radius:5px;background:var(--accent);min-width:3px;display:block}
  .barrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px}
  .barrow .lbl{width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
  .barrow .val{width:36px;text-align:right;color:var(--dim);font-size:12px}
  .hbars{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:6px}
  .hbars .h{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
  .hbars .h i{width:100%;background:var(--accent);border-radius:4px 4px 0 0;display:block;min-height:2px}
  .hbars .h small{font-size:10px;color:var(--dim)}
  .feed .f{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:10px}
  .feed .f:last-child{border-bottom:none}

  /* --- team tab --- */
  .userrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .userrow input,.userrow select{width:auto;padding:10px 12px;font-size:14px}
  .seats{font-size:12px;color:var(--dim);margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <div id="impersonating" class="banner hidden">
    <span>You are viewing this workspace as the master admin. This visit is recorded.</span>
    <a class="linkbtn" href="/master">Back to master</a>
  </div>

  <div class="top">
    <div>
      <h1 id="bizName">Dashboard</h1>
      <div class="muted" style="font-size:13px" id="rangeLabel"></div>
    </div>
    <div class="controls">
      <select id="preset">
        <option value="today">Today</option>
        <option value="7" selected>Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="custom">Custom…</option>
      </select>
      <input type="date" id="from" class="hidden">
      <input type="date" id="to" class="hidden">
      <a class="linkbtn" id="csv" href="#">Download data</a>
      <a class="linkbtn" id="timerLink" href="#">My timer</a>
      <a class="linkbtn" href="#" id="signout">Sign out</a>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="overview">Overview</button>
    <button class="tab" data-tab="details">Details</button>
    <button class="tab" data-tab="team">Team</button>
  </div>

  <!-- ================= OVERVIEW ================= -->
  <div id="tab-overview">
    <div class="card">
      <p class="headline" id="headline">Loading…</p>
    </div>
    <div class="people" id="people"></div>
    <p class="muted" style="font-size:12px;margin-top:16px;line-height:1.6" id="scoreNote"></p>
  </div>

  <!-- ================= DETAILS ================= -->
  <div id="tab-details" class="hidden">
    <div class="controls" style="margin-bottom:14px">
      <select id="userFilter"><option value="">All team members</option></select>
    </div>

    <div class="grid kpis" id="kpis"></div>

    <div class="gap"></div>
    <div class="cols3">
      <div class="card">
        <h2>WHAT PULLS PEOPLE AWAY</h2>
        <div id="reasons"></div>
      </div>
      <div class="card">
        <h2>BY CATEGORY</h2>
        <div id="cats"></div>
      </div>
      <div class="card feed">
        <h2>LATEST INTERRUPTIONS</h2>
        <div id="feed"></div>
      </div>
    </div>

    <div class="gap"></div>
    <div class="cols3">
      <div class="card">
        <h2>BEST HOURS OF THE DAY</h2>
        <div class="hbars" id="hours"></div>
        <div class="muted" style="font-size:12px;margin-top:10px" id="hoursNote"></div>
      </div>
      <div class="card">
        <h2>FOCUS MINUTES PER DAY</h2>
        <div class="hbars" id="daily"></div>
        <div class="muted" style="font-size:12px;margin-top:10px" id="dailyNote"></div>
      </div>
    </div>
  </div>

  <!-- ================= TEAM ================= -->
  <div id="tab-team" class="hidden">
    <div class="card">
      <h2>ADD A TEAM MEMBER</h2>
      <div class="userrow">
        <input type="text" id="nName" placeholder="Name">
        <input type="password" id="nPin" placeholder="PIN (4+ digits)">
        <input type="text" id="nTeam" placeholder="Department (optional)">
        <select id="nRole"><option value="employee">Team member</option><option value="admin">Admin</option></select>
        <button class="btn sm" id="addUser">Add</button>
        <span class="err" id="userErr" style="margin:0"></span>
        <span class="seats" id="seats"></span>
      </div>
      <table id="userTable">
        <thead><tr><th>Name</th><th>Role</th><th>Department</th><th>Status</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="muted" style="font-size:12px;margin-top:14px" id="staffLink"></div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const SLUG = location.pathname.split('/').filter(Boolean)[0] || '';
const KEY = 'ft_token_' + SLUG;
const token = localStorage.getItem(KEY);
if (!token) location.href = '/' + SLUG;

const api = async (p, o = {}) => {
  const r = await fetch(p, { ...o, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(o.headers || {}) } });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { localStorage.removeItem(KEY); location.href = '/' + SLUG; }
  if (!r.ok) throw new Error(d.error || 'Error');
  return d;
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const roleLabel = (r) => ({ owner: 'Owner', admin: 'Admin', employee: 'Team member' }[r] || r);

// ---------- plain-language helpers ----------
const fmtMin = (m) => {
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
};
const hourWord = (h) => {
  if (h === null || h === undefined) return null;
  const ampm = h < 12 ? 'am' : 'pm';
  const hr = h % 12 === 0 ? 12 : h % 12;
  return `${hr}${ampm}`;
};

// Four bands, described the way a manager would say it out loud.
function verdict(score) {
  if (score >= 85) return { word: 'Deeply focused', color: 'var(--good)' };
  if (score >= 70) return { word: 'Focused',        color: 'var(--good)' };
  if (score >= 55) return { word: 'Often pulled away', color: 'var(--warn)' };
  return { word: 'Struggling to focus', color: 'var(--bad)' };
}

function interruptionSentence(dph) {
  if (!dph) return 'Never stopped once';
  if (dph < 0.6) return 'Rarely stopped';
  const mins = Math.round(60 / dph);
  if (mins >= 55) return 'Stopped about once an hour';
  return `Stopped about every ${mins} min`;
}

function finishSentence(completed, total) {
  if (!total) return 'No sessions yet';
  if (completed === total) return `Finished all ${total} sessions`;
  return `Finished ${completed} of ${total} sessions`;
}

// ---------- range + tabs ----------
$('#timerLink').href = '/' + SLUG;
$('#signout').onclick = async (e) => {
  e.preventDefault();
  try { await api('/api/logout', { method: 'POST' }); } catch {}
  localStorage.removeItem(KEY);
  location.href = '/' + SLUG;
};

function currentRange() {
  const p = $('#preset').value;
  const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const today = iso(new Date());
  if (p === 'today') return { from: today, to: today };
  if (p === 'custom') return { from: $('#from').value || today, to: $('#to').value || today };
  const n = Number(p);
  return { from: iso(new Date(Date.now() - (n - 1) * 86400000)), to: today };
}
function qs() {
  const { from, to } = currentRange();
  const u = $('#userFilter').value;
  return `from=${from}&to=${to}${u ? '&user_id=' + u : ''}`;
}

$('#preset').onchange = () => {
  const custom = $('#preset').value === 'custom';
  $('#from').classList.toggle('hidden', !custom);
  $('#to').classList.toggle('hidden', !custom);
  if (!custom) load();
};
$('#from').onchange = $('#to').onchange = load;
$('#userFilter').onchange = load;

document.querySelector('.tabs').onclick = (e) => {
  const t = e.target.closest('.tab');
  if (!t) return;
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t));
  for (const n of ['overview', 'details', 'team']) {
    $('#tab-' + n).classList.toggle('hidden', n !== t.dataset.tab);
  }
};

$('#csv').onclick = async (e) => {
  e.preventDefault();
  const r = await fetch(`/api/admin/export.csv?${qs()}`, { headers: { Authorization: 'Bearer ' + token } });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await r.blob());
  a.download = `${SLUG}_${currentRange().from}_to_${currentRange().to}.csv`;
  a.click();
};

// ---------- overview ----------
function renderHeadline(d) {
  const t = d.totals;
  if (!t.sessions) {
    $('#headline').innerHTML =
      'Nobody has run a focus session in this period yet. Once your team starts using the timer, this page will tell you how their days are going.';
    $('#scoreNote').textContent = '';
    return;
  }
  const outOfTen = Math.round((t.completed / t.sessions) * 10);
  const top = d.topReasons[0];
  const pieces = [
    `Your team put in <b>${fmtMin(Math.round(t.focusedHours * 60))}</b> of focused work across <b>${t.sessions} sessions</b>.`,
    `<b>${outOfTen} out of every 10</b> sessions get finished.`,
    top ? `The thing that pulls people away most is <span class="hl">${esc(top.reason)}</span>.` : 'Nothing has interrupted them yet.',
  ];
  $('#headline').innerHTML = pieces.join(' ');
  $('#scoreNote').textContent =
    'The score on each card combines two things: how often someone finishes what they start, and how often they get pulled away. 70 and above is healthy.';
}

function renderPeople(d) {
  const el = $('#people');
  if (!d.employees.length) { el.innerHTML = ''; return; }

  el.innerHTML = d.employees.map((e) => {
    const v = verdict(e.focusScore);
    const facts = [];
    facts.push(['✓', finishSentence(e.completed, e.sessions)]);
    facts.push(['⏱', `<b>${fmtMin(e.focusedMinutes)}</b> of focused work` +
      (e.daysActive > 1 ? ` over ${e.daysActive} days` : '')]);
    facts.push(['⚡', interruptionSentence(e.distractionsPerHour)]);
    if (e.topDistraction) {
      facts.push(['📵', `Usually pulled away by <b>${esc(e.topDistraction.reason)}</b>`]);
    }
    if (e.bestHour !== null && e.bestHour !== undefined) {
      facts.push(['🌤', `Does best work around <b>${hourWord(e.bestHour)}</b>`]);
    }

    return `
      <div class="person">
        <div class="ph">
          <div>
            <div class="nm">${esc(e.name)}</div>
            ${e.team ? `<div class="dept">${esc(e.team)}</div>` : ''}
          </div>
          <span class="verdict" style="background:${v.color}1f;color:${v.color}">${v.word}</span>
        </div>
        <div class="meter"><i style="width:${Math.max(3, e.focusScore)}%;background:${v.color}"></i></div>
        <div class="facts">
          ${facts.map(([ic, txt]) => `<div><span class="ic">${ic}</span><span>${txt}</span></div>`).join('')}
        </div>
      </div>`;
  }).join('');
}

// ---------- details ----------
function barList(el, items, labelKey, valueKey, color) {
  if (!items.length) { el.innerHTML = '<div class="empty">Nothing logged 🎉</div>'; return; }
  const max = Math.max(...items.map((i) => i[valueKey]));
  el.innerHTML = items.map((i) => `
    <div class="barrow">
      <span class="lbl" title="${esc(i[labelKey])}">${esc(i[labelKey])}</span>
      <span style="flex:1"><span class="bar" style="width:${(i[valueKey] / max) * 100}%;background:${color}"></span></span>
      <span class="val">${i[valueKey]}</span>
    </div>`).join('');
}

function colBars(el, items, valueKey, labelFn, color) {
  if (!items.length) { el.innerHTML = '<div class="empty">No data</div>'; return; }
  const max = Math.max(...items.map((i) => i[valueKey]), 1);
  el.innerHTML = items.map((i) => `
    <div class="h" title="${labelFn(i)}: ${i[valueKey]}">
      <i style="height:${Math.max(2, (i[valueKey] / max) * 105)}px;background:${color}"></i>
      <small>${labelFn(i)}</small>
    </div>`).join('');
}

function renderDetails(d) {
  const t = d.totals;
  $('#kpis').innerHTML = [
    ['Sessions started', t.sessions],
    ['Sessions finished', t.completed],
    ['Hours of focus', t.focusedHours],
    ['Times interrupted', t.distractions],
    ['People active', t.activeEmployees],
  ].map(([label, val]) => `<div class="card kpi"><b>${val}</b><span>${label}</span></div>`).join('');

  barList($('#reasons'), d.topReasons, 'reason', 'count', 'var(--warn)');
  barList($('#cats'), d.categories, 'category', 'count', 'var(--accent)');

  colBars($('#hours'), d.hours, 'focusedMinutes', (h) => String(h.hour).padStart(2, '0'), 'var(--accent)');
  const best = [...d.hours].sort((a, b) => (b.completed / (b.sessions || 1)) - (a.completed / (a.sessions || 1)))[0];
  $('#hoursNote').textContent = best
    ? `Most sessions get finished around ${hourWord(best.hour)}.`
    : '';

  colBars($('#daily'), d.daily, 'focusedMinutes', (x) => x.date.slice(5), 'var(--good)');
  const days = d.daily.length || 1;
  $('#dailyNote').textContent =
    `The team averages ${fmtMin(Math.round(d.daily.reduce((a, x) => a + x.focusedMinutes, 0) / days))} of focus per day.`;

  $('#feed').innerHTML = d.recentDistractions.length
    ? d.recentDistractions.map((f) => `
        <div class="f">
          <span>${esc(f.reason)}</span>
          <span class="muted" style="white-space:nowrap">${esc(f.user.split(' ')[0])} · ${new Date(f.at).toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
        </div>`).join('')
    : '<div class="empty">No interruptions logged 🎉</div>';
}

async function load() {
  const d = await api(`/api/admin/stats?${qs()}`);
  $('#bizName').textContent = d.business.name;
  document.title = d.business.name + ' · FocusTrack';
  $('#rangeLabel').textContent = `${d.range.from} → ${d.range.to}`;
  renderHeadline(d);
  renderPeople(d);
  renderDetails(d);
}

// ---------- team ----------
async function loadUsers() {
  const { users, seatsUsed, seatLimit } = await api('/api/admin/users');
  const sel = $('#userFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All team members</option>' +
    users.filter((u) => u.active).map((u) => `<option value="${u.id}">${esc(u.name)}</option>`).join('');
  sel.value = cur;

  $('#seats').textContent = `${seatsUsed} of ${seatLimit} seats used`;
  $('#seats').style.color = seatsUsed >= seatLimit ? 'var(--warn)' : 'var(--dim)';
  $('#addUser').disabled = seatsUsed >= seatLimit;

  $('#userTable').querySelector('tbody').innerHTML = users.map((u) => `
    <tr>
      <td>${esc(u.name)}</td>
      <td class="muted">${roleLabel(u.role)}</td>
      <td class="muted">${esc(u.team) || '—'}</td>
      <td>${u.active ? '<span class="pill good">active</span>' : '<span class="pill">disabled</span>'}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn ghost sm" data-pin="${u.id}">Reset PIN</button>
        ${u.role === 'owner' ? '' :
          `<button class="btn ghost sm" data-tog="${u.id}" data-active="${u.active}">${u.active ? 'Disable' : 'Enable'}</button>`}
      </td>
    </tr>`).join('');

  $('#staffLink').innerHTML =
    `Your team signs in at <code class="mono">${location.origin}/${SLUG}</code> with their name and PIN.`;
}

$('#userTable').onclick = async (e) => {
  const pin = e.target.dataset.pin, tog = e.target.dataset.tog;
  try {
    if (pin) {
      const v = prompt('New PIN (4+ digits):');
      if (!v) return;
      await api(`/api/admin/users/${pin}`, { method: 'PATCH', body: JSON.stringify({ pin: v }) });
      alert('PIN updated.');
    }
    if (tog) {
      await api(`/api/admin/users/${tog}`, {
        method: 'PATCH', body: JSON.stringify({ active: e.target.dataset.active !== '1' }),
      });
      loadUsers();
    }
  } catch (err) { alert(err.message); }
};

$('#addUser').onclick = async () => {
  $('#userErr').textContent = '';
  try {
    await api('/api/admin/users', {
      method: 'POST',
      body: JSON.stringify({
        name: $('#nName').value, pin: $('#nPin').value,
        team: $('#nTeam').value, role: $('#nRole').value,
      }),
    });
    $('#nName').value = $('#nPin').value = $('#nTeam').value = '';
    loadUsers();
  } catch (e) { $('#userErr').textContent = e.message; }
};

(async () => {
  const me = await api('/api/me');
  if (!['owner', 'admin'].includes(me.user.role)) { location.href = '/' + SLUG; return; }
  if (me.user.impersonated_by) $('#impersonating').classList.remove('hidden');
  await loadUsers();
  await load();
})();
</script>
</body>
</html>
