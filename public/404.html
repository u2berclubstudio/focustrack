<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · FocusTrack</title>
<link rel="stylesheet" href="/style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:400px;text-align:center}
  .big{font-size:52px;margin-bottom:10px}
</style>
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FocusTrack">
<link rel="icon" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
(function () {
  var reserved = { master: 1, api: 1, admin: 1, health: 1 };
  var seg = location.pathname.split('/').filter(Boolean)[0] || '';
  var slug = (/^[a-z0-9][a-z0-9-]{1,31}$/.test(seg) && !reserved[seg]) ? seg : '';
  var l = document.createElement('link');
  l.rel = 'manifest';
  l.href = slug ? '/' + slug + '/manifest.webmanifest' : '/manifest.webmanifest';
  document.head.appendChild(l);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
})();
</script>
</head>
<body>
  <div class="box">
    <div class="big">🤔</div>
    <h1>That link doesn't exist</h1>
    <p class="sub">Check the spelling of your team link, or ask your admin for the right one.</p>
    <a class="linkbtn" href="/">Go to FocusTrack</a>
  </div>
</body>
</html>
